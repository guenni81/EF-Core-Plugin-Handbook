name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Unit tests (no database)
        run: dotnet test tests/Acme.EntityFrameworkCore.Tenancy.Tests -c Release --no-build

      # Docker is available on the Ubuntu runners: Testcontainers starts PostgreSQL
      - name: Integration tests (PostgreSQL)
        run: dotnet test tests/Acme.EntityFrameworkCore.Tenancy.IntegrationTests -c Release --no-build

      - name: SQL Server tests (unit + SQL Server via Testcontainers)
        run: dotnet test tests/Acme.EntityFrameworkCore.Tenancy.SqlServer.Tests -c Release --no-build

  # Builds both editions of the handbook with LuaLaTeX. Fails if a code excerpt exceeds
  # the maximum line length, a reference is undefined or the LaTeX sources are broken.
  handbook:
    runs-on: ubuntu-latest
    # TeX Live 2026 (pinned by digest; contains latexmk, minted/latexminted and Python)
    container: texlive/texlive@sha256:540d736c78e2803cdd7b6a196bd21339c30185948db55e04e75a415959102ca8
    defaults:
      run:
        working-directory: docs/handbook
    steps:
      - uses: actions/checkout@v4
      - name: Check code excerpts
        run: python3 check_code.py
      - name: Build PDFs (German and English)
        run: |
          latexmk EF-Core-Plugin-Handbuch.tex
          latexmk EF-Core-Plugin-Handbook.tex
      - name: Check for undefined references
        run: "! grep -n 'undefined' out/aux/*.log"
      - uses: actions/upload-artifact@v4
        with:
          name: handbook
          path: docs/handbook/out/*.pdf
